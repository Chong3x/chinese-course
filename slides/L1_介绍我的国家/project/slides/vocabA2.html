<h2>生词（二）</h2>
<table class="vocab">
<tr><th>词语</th><th>拼音</th><th>意思</th><th>例句</th></tr>
<tr><td class="w">漂亮</td><td>piàoliang</td><td class="m">beautiful / красивый</td><td>这个城市很漂亮。</td></tr>
<tr><td class="w">好吃</td><td>hǎochī</td><td class="m">tasty / вкусный</td><td>抓饭很好吃。</td></tr>

<aside>【A 版 · HSK2–3】问她：你最喜欢哪个季节？哈萨克斯坦什么东西很好吃？让她用新词回答。“比”可以多练几句：“我比我妹妹大”“今天比昨天冷”。</aside>

<section id="gram1" class="alt">
<p class="eyebrow">语法 1</p>
<h2>A 比 B ＋ 形容词</h2>
<p class="rule">A 比 B 贵　A 比 B 贵一点儿　A 比 B 贵多了　　不能说：A 比 B 很贵</p>
<div class="exs">
<p class="ex"><span class="nw">咖啡</span><span class="nwpy">kāfēi</span><span class="nw">比</span><span class="nwpy">bǐ</span><span class="nw">奶茶</span><span class="nwpy">nǎichá</span>贵。</p>
<p class="ex"><span class="nw">绿茶</span><span class="nwpy">lǜchá</span><span class="nw">比</span><span class="nwpy">bǐ</span><span class="nw">咖啡</span><span class="nwpy">kāfēi</span>便宜一点儿。</p>
<p class="ex">这家<span class="nw">饭馆</span><span class="nwpy">fànguǎn</span><span class="nw">比</span><span class="nwpy">bǐ</span>那家大多了。</p>
</div>
<div class="rows">
<div class="row"><p class="n">1</p><p class="prompt">咖啡和茶，哪个贵？</p><p class="ans fragment">咖啡比茶贵。</p></div>
<div class="row"><p class="n">2</p><p class="prompt">你和你哥哥，谁高？</p><p class="ans fragment">我哥哥比我高。</p></div>
</div>

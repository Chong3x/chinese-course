<p class="eyebrow">A 关 · 第 3 关（下）</p>
<h2>句子变变变：最有名的是……</h2>
<div class="pat"><p class="p1">……最有名的是……。</p><p class="p2">阿拉木图最有名的是苹果。</p></div>
<div class="rows">
<div class="row"><p class="n">1</p><div class="chips"><p class="chip">中国</p><p class="chip">长城</p></div><p class="ans fragment">中国最有名的是长城。</p></div>
<div class="row"><p class="n">2</p><div class="chips"><p class="chip">北京</p><p class="chip">烤鸭</p></div><p class="ans fragment">北京最有名的是烤鸭。</p></div>
<div class="row"><p class="n">3</p><div class="chips"><p class="chip">我的城市</p><p class="chip">？</p></div><p class="ans fragment">你来说！</p></div>
</div>
<aside>【A 版】第 3 题让她自由发挥，说说她自己城市最有名的东西。说完可以追问：“你最喜欢……，因为……”，顺便复习另一个句型。</aside>
</section>

<h2>记忆挑战：填出空着的词</h2>
<p class="passage">我是哈萨克斯坦人。我的家在______。阿拉木图是一个很______的城市。这里的冬天很冷，夏天不太热。阿拉木图最有名的是______，又大又好吃。我______喜欢夏天，因为天气很好，可以去山上玩儿。</p>
<p class="goal">过关：读完整段，不停顿</p>
<aside>【A 版】这是新课的范文，空了 4 个词。答案：阿拉木图、漂亮、苹果、最。她读的时候要把空着的词说出来。每一轮空的越来越多，到第 3 轮她基本就能背出来了，成就感很强。</aside>

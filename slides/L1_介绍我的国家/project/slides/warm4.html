<section id="warm4">
<p class="eyebrow">任务 1 · 聊一聊</p>
<h2>热身 4：说说你的想法</h2>
<div class="qs">
<p class="q fragment">你觉得学中文最难的是什么？为什么？</p>
<p class="q fragment">如果放假一个月，你打算做什么？</p>
<p class="q fragment">你为什么想考 HSK？</p>
</div>
<p class="tip">试试用“因为……所以……”“如果……就……”回答。</p>
<aside>HSK4 水平。看她能不能连着说 3 句以上，能不能讲出理由。她只说一个词的时候，追问“为什么？”“然后呢？”。这一页能聊下去，说明口语已经接近 HSK4。</aside>
</section>

<p class="eyebrow">B 关 · 第 3 关（下）</p>
<h2>句子变变变：虽然……，但是……</h2>
<div class="pat"><p class="p1">虽然……，但是……。</p><p class="p2">虽然冬天特别冷，但是风景非常美。</p></div>
<div class="rows">
<div class="row"><p class="n">1</p><div class="chips"><p class="chip">汉字很难</p><p class="chip">我很喜欢学</p></div><p class="ans fragment">虽然汉字很难，但是我很喜欢学。</p></div>
<div class="row"><p class="n">2</p><div class="chips"><p class="chip">今天很累</p><p class="chip">我还是想去踢球</p></div><p class="ans fragment">虽然今天很累，但是我还是想去踢球。</p></div>
<div class="row"><p class="n">3</p><div class="chips"><p class="chip">我的城市不大</p><p class="chip">？</p></div><p class="ans fragment">你来说！</p></div>
</div>
<aside>【B 版】提醒她：“虽然”后面常用“但是/可是”，后半句常加“还是”。第二轮反过来：你说后半句，她补前半句。</aside>
</section>

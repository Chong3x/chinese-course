<p class="eyebrow">任务 4 · 你来说</p>
<h2>轮到你了！介绍你的家乡</h2>
<div class="frames">
<p class="frame">我的家乡是______，它在哈萨克斯坦的______。</p>
<p class="frame">______最有名的是______。</p>
<p class="frame">虽然______，但是______。</p>
<p class="frame">我喜欢我的家乡，尤其是______。</p>
<p class="frame">如果你有机会来______，一定要______。</p>
</div>
<aside>让她自己介绍家乡城市。第一遍说的时候不要打断，说完只纠正 1–2 个最重要的错误，再让她重说一遍。第二遍一般会明显更好，这是她这节课的成就感来源。还有时间就反过来，让她问你：“你的家乡怎么样？”</aside>
</section>

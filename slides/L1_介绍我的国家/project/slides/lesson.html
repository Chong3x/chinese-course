<p class="eyebrow">任务 4 · 新课</p>
<h1>介绍我的国家</h1>
<p class="lead">学完以后，你能用五句话介绍哈萨克斯坦和你的家乡。</p>
<p class="lead">Қазақстан · Kazakhstan · 哈萨克斯坦</p>
<aside>【选版本】根据前面热身和闯关的表现选版本：HSK4 的题大多答不上来 → 继续翻，用 A 版（HSK2–3，第 16–21 页），做完从第 21 页跳到第 28 页；HSK4 的题基本能答 → 跳到第 22 页，用 B 版（HSK4，第 22–27 页）。拿不准就用 A 版，她学得轻松再加难度。先问她：“你的国家叫什么？用中文怎么说？”再问：“你住在哪个城市？”如果手边有阿拉木图或阿斯塔纳的照片，可以在这里屏幕共享，用照片引出后面的生词。</aside>

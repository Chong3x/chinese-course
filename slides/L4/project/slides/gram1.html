<section id="gram1" class="alt">
<p class="eyebrow">语法 1</p>
<h2>动词 ＋ 着</h2>
<p class="rule">V ＋ 着 = 一直是这样（state）：穿着、拿着、笑着</p>
<div class="exs">
<p class="ex">他穿<span class="nw">着</span><span class="nwpy">zhe</span><span class="nw">黑色</span><span class="nwpy">hēisè</span>的<span class="nw">裤子</span><span class="nwpy">kùzi</span>。</p>
<p class="ex">她<span class="nw">手</span><span class="nwpy">shǒu</span>里拿<span class="nw">着</span><span class="nwpy">zhe</span>一杯奶茶。</p>
<p class="ex">她<span class="nw">笑</span><span class="nwpy">xiào</span><span class="nw">着</span><span class="nwpy">zhe</span>说：“你好！”</p>
</div>
<div class="rows">
<div class="row"><p class="n">1</p><p class="prompt">他穿着什么？（白色的衣服）</p><p class="ans fragment">他穿着白色的衣服。</p></div>
<div class="row"><p class="n">2</p><p class="prompt">她手里拿着什么？（一本书）</p><p class="ans fragment">她手里拿着一本书。</p></div>
</div>

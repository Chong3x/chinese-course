<h2>热身 1：认识一下</h2>
<div class="qs">
<p class="q fragment">你叫什么名字？</p>
<p class="q fragment">你今年多大？</p>
<p class="q fragment">你家有几口人？</p>
<p class="q fragment">你住在哪儿？</p>
</div>
<p class="tip">先听，再看。听不懂可以说：“请再说一遍。”</p>
<aside>HSK1 水平。先口头问，她答不出来再点击显示文字。看她能不能用完整句子回答，比如“我今年十五岁”，而不是只说“十五”。她都能轻松回答，就快速进入下一页。</aside>

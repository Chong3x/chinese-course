<h2>说一说：在饭馆点菜</h2>
<div class="frames">
<p class="frame">你好！请问你要______还是______？</p>
<p class="frame">我要一______。</p>
<p class="frame">______比______好吃 / 贵。</p>
<p class="frame">虽然______，但是______。</p>
<p class="frame">这个多少钱？</p>
</div>
<aside>4 分钟。让她用这些句子说自己的情况。第一遍不打断，说完只纠正 1–2 个最重要的错误，再让她重说一遍。</aside>
</section>

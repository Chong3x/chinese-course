<h2>说一说：我怎么去学校</h2>
<div class="frames">
<p class="frame">我家离学校______。</p>
<p class="frame">我经常______去学校，有时______。</p>
<p class="frame">我每天______点出门。</p>
<p class="frame">路上要______分钟。</p>
<p class="frame">现在已经______了，我快要______了。</p>
</div>
<aside>4 分钟。让她用这些句子说自己的情况。第一遍不打断，说完只纠正 1–2 个最重要的错误，再让她重说一遍。</aside>

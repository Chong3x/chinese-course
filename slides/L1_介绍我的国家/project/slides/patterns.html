<p class="eyebrow">任务 4 · 句型</p>
<h2>五个句型</h2>
<div class="pats">
<div class="pat"><p class="p1">……的首都是……，最大的城市是……</p><p class="p2">哈萨克斯坦的<span class="nw">首都</span><span class="nwpy">shǒudū</span>是阿斯塔纳，最大的<span class="nw">城市</span><span class="nwpy">chéngshì</span>是阿拉木图。</p></div>
<div class="pat"><p class="p1">……最有名的是……</p><p class="p2">我们国家最<span class="nw">有名</span><span class="nwpy">yǒumíng</span>的是草原和雪山。</p></div>
<div class="pat"><p class="p1">虽然……，但是……</p><p class="p2">虽然冬天很冷，但是风景<span class="nw">特别</span><span class="nwpy">tèbié</span>美。</p></div>
<div class="pat"><p class="p1">……，尤其是……</p><p class="p2">我喜欢哈萨克菜，尤其是抓饭。</p></div>
<div class="pat"><p class="p1">如果你有机会来……，一定要……</p><p class="p2">如果你有机会来阿拉木图，一定要去山上看看。</p></div>
</div>
<aside>每个句型：你先读例句，她跟读，再让她换一个词说一句新的。“尤其是”和“如果……一定要……”是 HSK4 写作和口语里很好用的句型。</aside>
</section>

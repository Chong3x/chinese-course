<section id="aFix">
<p class="eyebrow">A 关 · 第 5 关</p>
<h2>找错误：哪里不对？</h2>
<div class="rows">
<div class="row"><p class="tag2">错句</p><p class="prompt">我喜欢最夏天。</p><p class="ans fragment">我最喜欢夏天。</p></div>
<div class="row"><p class="tag2">错句</p><p class="prompt">今天比昨天很冷。</p><p class="ans fragment">今天比昨天冷。</p></div>
<div class="row"><p class="tag2">错句</p><p class="prompt">这个城市是很漂亮。</p><p class="ans fragment">这个城市很漂亮。</p></div>
<div class="row"><p class="tag2">错句</p><p class="prompt">我的家在是阿拉木图。</p><p class="ans fragment">我的家在阿拉木图。</p></div>
</div>
<aside>【A 版】这四个都是外国学生最常犯的错：1 “最”要放在动词前面；2 比字句里不能加“很”；3 形容词前面不用“是”；4 “在”和“是”不能一起用。让她先找出错在哪儿、说出正确的句子，再点击显示答案。她能说出为什么错，就说明真的掌握了。</aside>
</section>

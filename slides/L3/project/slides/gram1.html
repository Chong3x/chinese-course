<section id="gram1" class="alt">
<p class="eyebrow">语法 1</p>
<h2>动词 ＋ 过</h2>
<p class="rule">V ＋ 过 = have done (before)　　没 ＋ V ＋ 过 = have never done</p>
<div class="exs">
<p class="ex">我去<span class="nw">过</span><span class="nwpy">guo</span>中国。</p>
<p class="ex">我<span class="nw">踢</span><span class="nwpy">tī</span><span class="nw">过</span><span class="nwpy">guo</span><span class="nw">足球</span><span class="nwpy">zúqiú</span>，但是没<span class="nw">打</span><span class="nwpy">dǎ</span><span class="nw">过</span><span class="nwpy">guo</span><span class="nw">篮球</span><span class="nwpy">lánqiú</span>。</p>
<p class="ex">你看<span class="nw">过</span><span class="nwpy">guo</span>这个电影吗？</p>
</div>
<div class="rows">
<div class="row"><p class="n">1</p><p class="prompt">你去过阿拉木图吗？</p><p class="ans fragment">我去过 / 没去过阿拉木图。</p></div>
<div class="row"><p class="n">2</p><p class="prompt">你游过泳吗？</p><p class="ans fragment">我游过泳。/ 我没游过泳。</p></div>
</div>

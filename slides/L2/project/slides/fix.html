<section id="fix">
<p class="eyebrow">游戏 4 · 找错误</p>
<h2>找错误：哪里不对？</h2>
<div class="rows">
<div class="row"><p class="tag2">错句</p><p class="prompt">我家很近离学校。</p><p class="ans fragment">我家离学校很近。</p></div>
<div class="row"><p class="tag2">错句</p><p class="prompt">他已经回来。</p><p class="ans fragment">他已经回来了。</p></div>
<div class="row"><p class="tag2">错句</p><p class="prompt">公交车快要来。</p><p class="ans fragment">公交车快要来了。</p></div>
<div class="row"><p class="tag2">错句</p><p class="prompt">我去学校经常走路。</p><p class="ans fragment">我经常走路去学校。</p></div>
</div>
<aside>3 分钟。让她先说错在哪儿、说出正确的句子，再点击显示答案。错在哪里：1 “离”要放在两个地方中间：A 离 B 很近；2、3 “已经……了”“快要……了”最后的“了”不能少；4 “经常”要放在动词前面。</aside>
</section>

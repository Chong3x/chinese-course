<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第 4 课 · 我的好朋友 · 课后练习</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=ZCOOL+KuaiLe&display=swap">
<style>
:root{--ink:#14304A;--soft:#3D4F63;--bg:#F7F5EE;--card:#FDFCF8;--sky:#E3F0F6;--blue:#17698F;--blue2:#2FA4D8;--gold:#F2C14E;--red:#9A3412;--green:#2E7D4F;--line:#D9E2E8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.fun{font-family:'ZCOOL KuaiLe','Noto Sans SC',sans-serif;font-weight:400}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
header.top .t1{font-size:14px;color:var(--blue);font-weight:700;letter-spacing:1px}
header.top h1{margin:2px 0 0;font-size:30px}
header.top .tr{font-size:14px;color:var(--soft)}
.lang{border:2px solid var(--line);border-radius:10px;padding:6px 8px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit}
.hright{display:flex;gap:8px;align-items:center}
.back{border:none;background:var(--sky);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:16px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-size:28px}
.stat span{font-size:13px;color:var(--soft)}
.bar{height:14px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue2),var(--green));border-radius:8px;transition:width .5s}
.today{background:var(--ink);color:#F7F5EE;border-radius:20px;padding:18px 20px;margin-bottom:16px}
.today .k{color:var(--gold);font-size:14px;font-weight:700;letter-spacing:1px}
.today h2{margin:6px 0 4px;font-size:24px}
.today p{margin:0;color:#C9DCE8;font-size:15px;line-height:1.6}
.today .go{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.tasks{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.task{display:flex;align-items:center;gap:12px;border:none;border-radius:12px;padding:12px;background:var(--gold);color:var(--ink);text-align:left;font-family:inherit}
.task.on{background:#24496B;color:#F7F5EE}
.task .ck{width:28px;height:28px;border-radius:50%;border:3px solid currentColor;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;box-sizing:border-box}
.task.on .ck{background:#2E7D4F;border-color:#2E7D4F;color:#fff}
.task .tx{flex:1;display:flex;flex-direction:column}.task .tx b{font-size:16px}.task .tx small{font-size:12px;opacity:.85}
.task .ar{font-size:22px;font-weight:700}
.today .go button{border:none;background:var(--gold);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mod{background:var(--card);border:2px solid transparent;border-radius:18px;padding:16px;text-align:left;color:var(--ink)}
.mod:hover{border-color:var(--blue2)}
.mod .ic{font-size:26px}
.mod b{display:block;font-size:19px;margin:4px 0 2px}
.mod span{font-size:13px;color:var(--soft)}
.mod .done{color:var(--green);font-weight:700}
.report{margin-top:16px;width:100%;border:none;background:var(--gold);color:var(--ink);border-radius:16px;padding:16px;font-size:18px;font-weight:700}
.panel{background:var(--card);border-radius:20px;padding:22px 18px;text-align:center}
.prog{font-size:14px;color:var(--soft);margin-bottom:6px}
.big{font-size:72px;font-weight:700;line-height:1.2;margin:10px 0}
.mid{font-size:24px;color:var(--blue);font-weight:700}
.small{font-size:16px;color:var(--soft)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:16px 10px;font-size:24px;font-weight:700;color:var(--ink)}
.opt.sm{font-size:17px}
.opt.ok{border-color:var(--green);background:#E3F3E8}
.opt.no{border-color:var(--red);background:#FBE9E2}
.row2{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btn{border:none;border-radius:14px;padding:14px 20px;font-size:18px;font-weight:700}
.b-blue{background:var(--blue);color:#fff}.b-gold{background:var(--gold);color:var(--ink)}.b-green{background:var(--green);color:#fff}.b-red{background:var(--red);color:#fff}.b-sky{background:var(--sky);color:var(--ink)}
.spk{border:none;background:var(--sky);border-radius:50%;width:64px;height:64px;font-size:28px}
.fb{min-height:30px;margin-top:12px;font-size:20px;font-weight:700}
.fb.ok{color:var(--green)}.fb.no{color:var(--red)}
.line{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 6px;border-bottom:1px solid var(--line)}
.line .who{flex:none;background:var(--blue);color:#fff;border-radius:8px;padding:2px 8px;font-size:14px;font-weight:700;margin-top:6px}
.line .say{font-size:22px;line-height:1.7;flex:1}
.line .play{flex:none;border:none;background:var(--sky);border-radius:10px;padding:6px 10px;font-size:18px}
.nw{font-weight:700;border-bottom:2px dotted var(--blue2);cursor:pointer}
.nw .py{display:none;font-size:13px;color:var(--blue);font-weight:400;margin-left:2px}
.nw.show .py{display:inline}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chip{border:2px solid var(--ink);background:var(--gold);border-radius:12px;padding:8px 14px;font-size:20px;font-weight:700;color:var(--ink)}
.chip.used{opacity:.25}
.answer{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:12px;font-size:24px;margin-top:12px;background:#fff}
.hw{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
#hzbox{background:#fff;border:2px solid var(--line);border-radius:16px;touch-action:none}
.charlist{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.charlist button{border:2px solid var(--line);background:#fff;border-radius:12px;width:52px;height:52px;font-size:26px;font-weight:700;color:var(--ink)}
.charlist button.cur{border-color:var(--blue)}
.charlist button.ok{background:#E3F3E8;border-color:var(--green)}
.win{animation:pop .5s ease}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
textarea{width:100%;min-height:150px;font-size:16px;border-radius:12px;border:2px solid var(--line);padding:10px;font-family:inherit}
.note{font-size:13px;color:var(--soft);margin-top:10px}
@media (max-width:480px){.big{font-size:60px}.opt{font-size:21px}.grid{gap:10px}}
</style>
</head>
<body>

function canSpeak(){ return !!(AUDIO && Object.keys(AUDIO).length) || !!zhVoice || !!claudeTts; }
function speak(text){
  if(AUDIO[text]){ try{ new Audio(AUDIO[text]).play(); return true; }catch(e){} }
  if(zhVoice){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.voice=zhVoice; u.lang=zhVoice.lang; u.rate=0.8; speechSynthesis.speak(u); return true; }catch(e){} }
  if(claudeTts){ claudeTts.speak(text,{language:'zh-CN',rate:0.85}).catch(()=>{}); return true; }
  return false;
}

// ---------- 页面 ----------
const app=document.getElementById('app');
function header(title, sub, back=true, tr=''){
  return `<header class="top"><div><div class="t1">${esc(sub)}</div><h1 class="fun">${esc(title)}</h1>${tr?`<div class="tr">${esc(tr)}</div>`:''}</div><div class="hright">${back?`<button class="back" onclick="home()">${t('back')}</button>`:langSel()}</div></header>`;
}
const PLANS = {0:['p0',['cards']],1:['pX',['cards','listen']],2:['pX',['recog','read']],3:['pX',['write','hw']],4:['pX',['cards','recog']],5:['pX',['read','hw']],6:['p6',['quiz']]};
const MODK = ['cards','listen','recog','read','write','hw','quiz'];
const ICON = {cards:'🃏',listen:'👂',recog:'👀',read:'📖',write:'✍️',hw:'📝',quiz:'🏆'};
function mt(k){ return t('m_'+k); }
function home(){
  const n=nMastered(), tot=L.words.length, p=Math.round(n/tot*100);
  const d=new Date().getDay(); const pl=PLANS[d]; const lg=S.log[today()]||{};
  const k=t('wd')[d];
  const ptitle = pl[0]==='pX' ? pl[1].map(mt).join(' + ') : t(pl[0]+'t');
  const pdesc = pl[0]==='pX' ? t('pXd') : t(pl[0]+'d');
  const ndone = pl[1].filter(m=>lg[m]).length;
  app.innerHTML = header(L.title, L.sub, false, (L.tr||{})[LANG]&&LANG!=='zh'?L.tr[LANG]:'') + `
  <div class="stats">
    <div class="stat"><b>${n}/${tot}</b><span>${t('mastered')}</span><div class="bar"><i style="width:${p}%"></i></div></div>
    <div class="stat"><b>⭐ ${S.stars}</b><span>${t('stars')}</span></div>
    <div class="stat"><b>🔥 ${S.days}</b><span>${t('streak')}</span></div>
  </div>
  <div class="today"><div class="k">${t('todayTask')} · ${k}<span style="float:right;color:#C9DCE8;font-weight:400">${t('doneN',{a:ndone,b:pl[1].length})}</span></div><h2 class="fun">${ptitle}</h2><p>${pdesc}</p>
    <div class="tasks">${pl[1].map(m=>`<button class="task ${lg[m]?'on':''}" onclick="openMod('${m}')"><span class="ck">${lg[m]?'✓':''}</span><span class="tx"><b>${ICON[m]} ${mt(m)}</b><small>${lg[m]?sc(lg[m].score):t('s_'+m)}</small></span><span class="ar">›</span></button>`).join('')}</div></div>
  <div class="grid">${MODK.map(k=>`<button class="mod" onclick="openMod('${k}')"><div class="ic">${ICON[k]}</div><b>${mt(k)}</b><span>${t('s_'+k)}</span>${lg[k]?`<div class="done">${t('todayDone')} ${sc(lg[k].score)}</div>`:''}</button>`).join('')}</div>
  <button class="report" onclick="report()">${t('reportBtn')}</button>
  <p class="note">${t('note',{n:MASTER})}${canSpeak()?'':' '+t('noVoice')}</p>`;
  window.scrollTo(0,0);
}
function openMod(m){ ({cards,listen,recog,read,write,hw,quiz})[m](); }
function finish(mod, score, starsGot){
  const lg=dayLog(); lg[mod]={score}; S.stars+=starsGot; touchDay(); save();
  app.innerHTML = header(mt(mod), L.sub) + `<div class="panel win"><div class="big">🎉</div><div class="mid fun">${t('finish')}</div>
  <p class="small">${esc(sc(score))}　·　${t('gotStars')} ⭐ ${starsGot}</p><p class="small">${t('masteredN',{a:nMastered(),b:L.words.length})}</p>
  <div class="row2"><button class="btn b-gold" onclick="openMod('${mod}')">${t('again')}</button><button class="btn b-blue" onclick="home()">${t('home')}</button></div></div>`;
}
function pickWords(n){
  const not=shuffle(L.words.filter(x=>!mastered(x[0])).map(x=>x[0]));
  const yes=shuffle(L.words.filter(x=>mastered(x[0])).map(x=>x[0]));
  return not.concat(yes).slice(0,n);
}

// 1 记新词
function cards(){
  let q=pickWords(10), i=0, good=0, total=q.length;
  function show(flip){
    if(!q.length){ return finish('cards', ['cards',good,total], good>=8?3:good>=5?2:1); }
    const w=W[q[0]];
    app.innerHTML = header(mt('cards'), L.sub) + `<div class="panel"><div class="prog">${t('cardsLeft',{n:q.length})}</div>
      <div class="big">${esc(w.w)}</div>
      ${flip?`<div class="mid">${esc(w.py)}</div><p class="small">${esc(w.en)}<br>${esc(w.ru)}</p><button class="spk" onclick="speak('${w.w}')">🔊</button>
        <div class="row2"><button class="btn b-red" id="no">${t('notYet')}</button><button class="btn b-green" id="yes">${t('know')}</button></div>`
      :`<p class="small">${t('cardsHint')}</p><div class="row2"><button class="btn b-blue" id="flip">${t('show')}</button></div>`}</div>`;
    if(flip){ speak(w.w);
      document.getElementById('yes').onclick=()=>{ mark(w.w,true); good++; q.shift(); show(false); };
      document.getElementById('no').onclick=()=>{ mark(w.w,false); const c=q.shift(); q.splice(Math.min(2,q.length),0,c); show(false); };
    } else document.getElementById('flip').onclick=()=>show(true);
  }
  show(false);
}
// 选择题通用
function mcq(mod, items, render){
  let i=0, good=0; const n0=items.length;
  function next(){
    if(i>=items.length){ return finish(mod, ['first',good,n0], good>=n0*0.9?3:good>=n0*0.6?2:1); }
    const it=items[i];
    app.innerHTML = header(mt(mod), L.sub) + `<div class="panel"><div class="prog">${it.again?t('retry')+'　·　':''}${t('qnum',{i:Math.min(i+1,n0),n:n0})}</div>${render.q(it)}
      <div class="opts">${it.opts.map((o,k)=>`<button class="opt ${render.small?'sm':''}" data-k="${k}">${esc(o)}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`;
    if(render.after) render.after(it);
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(app.querySelector('.opt.ok')) return;
      const k=+b.dataset.k, right=it.opts[k]===it.ans;
      b.classList.add(right?'ok':'no');
      app.querySelectorAll('.opt').forEach(x=>{ if(it.opts[+x.dataset.k]===it.ans) x.classList.add('ok'); });
      if(it.word) mark(it.word, right);
      const fb=document.getElementById('fb');
      fb.className='fb '+(right?'ok':'no'); fb.textContent = right? t('right') : t('wrong');
      if(right && !it.again) good++; if(!right && it.retry) items.push(Object.assign({},it,{retry:false,again:true,opts:shuffle(it.opts)}));
      i++; setTimeout(next, right?700:1600);
    });
  }
  next();
}
// 词义：所有界面语言都同时显示英文和俄文
function mean(w){ const x=W[w]; return x.en+' / '+x.ru; }
function distract(word, field, n=3){
  return shuffle(L.words.filter(x=>x[0]!==word).map(x=>field==='w'?x[0]:mean(x[0]))).slice(0,n);
}
// 2 听一听
function listen(){
  const voice=canSpeak();
  const items=pickWords(10).map(w=>({word:w, ans:w, opts:shuffle([w].concat(distract(w,'w'))), retry:true}));
  mcq('listen', items, {
    q: it => voice ? `<p class="small">${t('listenQ')}</p><button class="spk" id="sp">🔊</button>`
                   : `<p class="small">${t('noVoiceQ')}</p><div class="mid">${esc(W[it.word].py)}</div>`,
    after: it => { const b=document.getElementById('sp'); if(b){ b.onclick=()=>speak(it.word); setTimeout(()=>speak(it.word),250); } }
  });
}
// 3 认一认
function recog(){
  const ws=pickWords(10);
  const items=ws.map((w,k)=> k%2===0
    ? {word:w, ans:mean(w), opts:shuffle([mean(w)].concat(distract(w,'mean'))), qtype:'h2m', retry:true}
    : {word:w, ans:w, opts:shuffle([w].concat(distract(w,'w'))), qtype:'m2h', retry:true});
  mcq('recog', items, {
    small:false,
    q: it => it.qtype==='h2m' ? `<p class="small">${t('h2m')}</p><div class="big">${esc(it.word)}</div>`
                              : `<p class="small">${t('m2h')}</p><div class="mid">${esc(W[it.word].en)}</div><p class="small">${esc(W[it.word].ru)}</p>`,
    after: it => { if(it.qtype==='h2m') app.querySelectorAll('.opt').forEach(b=>b.classList.add('sm')); }
  });
}
// 4 读一读
function lineHTML(s){
  return esc(s).replace(/\{([^}]+)\}/g,(m,w)=>`<span class="nw" onclick="this.classList.toggle('show')">${w}<span class="py">${esc((W[w]||{}).py||'')}</span></span>`);
}
function plain(s){ return s.replace(/[{}]/g,''); }
function read(){
  let times=0;
  function page(){
    app.innerHTML = header(mt('read'), L.sub) + `<div class="panel" style="text-align:left">
      <p class="small">${t('readHint')}</p>
      <h2 class="fun" style="text-align:center">${esc(L.text_title)}</h2>
      ${L.text.map((l,k)=>`<div class="line">${l[0]&&!L.narrative?`<span class="who">${esc(l[0])}</span>`:''}<div class="say">${lineHTML(l[1])}</div><button class="play" data-k="${k}">🔊</button></div>`).join('')}
      <div class="row2"><button class="btn b-gold" id="once">${t('readOnce',{n:times})}</button>${times>=3?`<button class="btn b-blue" id="qs">${t('toQs')}</button>`:''}</div></div>`;
    app.querySelectorAll('.play').forEach(b=>b.onclick=()=>speak(plain(L.text[+b.dataset.k][1])));
    document.getElementById('once').onclick=()=>{ times++; touchDay(); page(); };
    const qb=document.getElementById('qs'); if(qb) qb.onclick=questions;
  }
  function questions(){
    const answers=L.q.map(x=>x[1]);
    const items=L.q.map(x=>({ans:x[1], opts:shuffle(answers), q:x[0]}));
    mcq('read', items, {small:true, q: it=>`<p class="small">${t('textQ')}</p><div class="mid">${esc(it.q)}</div>`});
  }
  page();
}
// 5 写一写
function write(){
  const chars=L.write; let cur=0, writer=null;
  function page(){
    const c=chars[cur];
    app.innerHTML = header(mt('write'), L.sub) + `<div class="panel">
      <p class="small">${t('writeHint')}</p>
      <div class="charlist">${chars.map((x,k)=>`<button class="${k===cur?'cur':''} ${S.written[x.c]?'ok':''}" data-k="${k}">${x.c}</button>`).join('')}</div>
      <div class="mid">${esc(c.c)}　<span class="small">${esc(c.py)} · ${esc(t('inWord',{w:c.word}))}</span></div>
      <div class="hw"><div id="hzbox"></div></div>
      <div class="fb" id="fb"></div>
      <div class="row2"><button class="btn b-sky" id="anim">${t('anim')}</button><button class="btn b-blue" id="quiz">${t('myTurn')}</button>${S.written[c.c]?'':''}</div>
      <p class="note">${t('canWrite',{a:chars.filter(x=>S.written[x.c]).length,b:chars.length})}</p></div>`;
    app.querySelectorAll('.charlist button').forEach(b=>b.onclick=()=>{ cur=+b.dataset.k; page(); });
    const size=Math.min(300, window.innerWidth-80);
    if(typeof HanziWriter==='undefined' || !STROKES[c.c]){ document.getElementById('hzbox').innerHTML=`<p class="small" style="padding:20px">${t('noStroke')}</p>`; return; }
    writer = HanziWriter.create('hzbox', c.c, {width:size, height:size, padding:12, showOutline:true, strokeAnimationSpeed:1, delayBetweenStrokes:250,
      charDataLoader:(ch, onLoad)=>onLoad(STROKES[ch]), strokeColor:'#14304A', radicalColor:'#17698F', outlineColor:'#DDDDDD', drawingColor:'#17698F', highlightColor:'#2FA4D8'});
    document.getElementById('anim').onclick=()=>writer.animateCharacter();
    document.getElementById('quiz').onclick=()=>startQuiz(c);
  }
  function startQuiz(c){
    const fb=document.getElementById('fb'); fb.className='fb'; fb.textContent=t('strokeGo');
    let round=0;
    function go(outline){
      writer.quiz({showOutline:outline, showHintAfterMisses:2, leniency:1.1,
        onComplete: d => {
          round++;
          if(round===1){ fb.className='fb ok'; fb.textContent=t('round2'); setTimeout(()=>{ writer.hideOutline(); go(false); }, 900); }
          else { const ok=d.totalMistakes<=2; fb.className='fb '+(ok?'ok':'no');
            fb.textContent = ok ? t('wroteOk',{c:c.c}) : t('wroteNo');
            if(ok && !S.written[c.c]){ S.written[c.c]=true; S.stars+=1; touchDay(); save(); dayLog().write={score:['write',chars.filter(x=>S.written[x.c]).length,chars.length]}; save(); }
            writer.showOutline(); }
        }});
    }
    go(true);
  }
  page();
}
// 6 练一练（作业）
function hw(){
  const items=[];
  L.fill.forEach(f=>items.push({t:'fill', q:f[0], ans:f[1], opts:shuffle(L.fill_bank.slice()).slice(0,6)}));
  L.order.forEach(o=>items.push({t:'order', chips:shuffle(o[0]), ans:o[1]}));
  L.fix.forEach(x=>items.push({t:'fix', ans:x[1], opts:shuffle([x[0],x[1]])}));
  let i=0, good=0;
  function norm(s){ return s.replace(/[，。！？、“”：；\s,.!?]/g,''); }
  function next(){
    if(i>=items.length){ return finish('hw', ['hw',good,items.length], good>=items.length*0.9?3:good>=items.length*0.6?2:1); }
    const it=items[i];
    const head=`<div class="prog">${t('qnum',{i:i+1,n:items.length})}</div>`;
    if(it.t==='fill' || it.t==='fix'){
      const q = it.t==='fill' ? `<p class="small">${t('fillQ')}</p><div class="mid" style="color:var(--ink)">${esc(it.q.replace('___','（　　）'))}</div>`
                              : `<p class="small">${t('fixQ')}</p>`;
      app.innerHTML = header(mt('hw'), L.sub) + `<div class="panel">${head}${q}<div class="opts">${it.opts.map((o,k)=>`<button class="opt ${it.t==='fix'?'sm':''}" data-k="${k}">${esc(o)}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`;
      app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
        if(app.querySelector('.opt.ok')) return;
        const right=it.opts[+b.dataset.k]===it.ans; b.classList.add(right?'ok':'no');
        app.querySelectorAll('.opt').forEach(x=>{ if(it.opts[+x.dataset.k]===it.ans) x.classList.add('ok'); });
        const fb=document.getElementById('fb'); fb.className='fb '+(right?'ok':'no');
        fb.textContent = right?t('right'):t('wrongAns')+(it.t==='fill'?it.q.replace('___',it.ans):it.ans);
        if(right) good++; i++; setTimeout(next, right?700:2000);
      });
    } else {
      let built=[];
      function draw(){
        app.innerHTML = header(mt('hw'), L.sub) + `<div class="panel">${head}<p class="small">${t('orderQ')}</p>
          <div class="answer">${esc(built.map(k=>it.chips[k]).join(''))}</div>
          <div class="chips">${it.chips.map((c,k)=>`<button class="chip ${built.includes(k)?'used':''}" data-k="${k}">${esc(c)}</button>`).join('')}</div>
          <div class="row2"><button class="btn b-sky" id="clr">${t('clear')}</button><button class="btn b-blue" id="chk">${t('check')}</button></div><div class="fb" id="fb"></div></div>`;
        app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; if(!built.includes(k)){ built.push(k); draw(); } });
        document.getElementById('clr').onclick=()=>{ built=[]; draw(); };
        document.getElementById('chk').onclick=()=>{
          const right=norm(built.map(k=>it.chips[k]).join(''))===norm(it.ans);
          const fb=document.getElementById('fb'); fb.className='fb '+(right?'ok':'no');
          fb.textContent = right?t('right')+' '+it.ans : t('wrongAns')+it.ans;
          if(right) good++; i++; setTimeout(next, right?900:2200);
        };
      }
      draw();
    }
  }
  next();
}
// 7 周末小测
function quiz(){
  const ws=shuffle(L.words.map(x=>x[0])).slice(0,15);
  const voice=canSpeak();
  const items=ws.map((w,k)=>{
    const t=k%3;
    if(t===0 && voice) return {word:w, ans:w, opts:shuffle([w].concat(distract(w,'w'))), kind:'listen'};
    if(t===1) return {word:w, ans:mean(w), opts:shuffle([mean(w)].concat(distract(w,'mean'))), kind:'h2m'};
    return {word:w, ans:w, opts:shuffle([w].concat(distract(w,'w'))), kind:'m2h'};
  });
  mcq('quiz', items, {
    q: it => it.kind==='listen' ? `<p class="small">${t('quizListen')}</p><button class="spk" id="sp">🔊</button>`
          : it.kind==='h2m' ? `<p class="small">${t('h2m')}</p><div class="big">${esc(it.word)}</div>`
          : `<p class="small">${t('m2h')}</p><div class="mid">${esc(W[it.word].en)}</div><p class="small">${esc(W[it.word].ru)}</p>`,
    after: it => { if(it.kind==='h2m') app.querySelectorAll('.opt').forEach(b=>b.classList.add('sm'));
                   const b=document.getElementById('sp'); if(b){ b.onclick=()=>speak(it.word); setTimeout(()=>speak(it.word),250);} }
  });
}
// 汇报
function report(){
  const now=new Date(), lg=S.log[today()]||{};
  const lines=[`${now.getMonth()+1} 月 ${now.getDate()} 日 · ${L.sub.replace('课后练习 · ','')} · ${L.title}`];
  const keys=MODK.filter(k=>lg[k]);
  if(keys.length) keys.forEach(k=>lines.push(`✅ ${tz('m_'+k)}：${scz(lg[k].score)||'完成'}`)); else lines.push('今天还没有练习');
  lines.push(`📚 已掌握：${nMastered()} / ${L.words.length} 个词`);
  const wc=L.write.filter(x=>S.written[x.c]).length; lines.push(`✍️ 会写：${wc} / ${L.write.length} 个字`);
  lines.push(`🔥 连续学习 ${S.days} 天　⭐ ${S.stars}`);
  const weak=L.words.filter(x=>S.w[x[0]].no>S.w[x[0]].ok && S.w[x[0]].no>0).map(x=>x[0]).slice(0,5);
  if(weak.length) lines.push(`🔁 还要多练：${weak.join('、')}`);
  const text=lines.join('\n');
  app.innerHTML = header(t('reportTitle'), L.sub) + `<div class="panel"><p class="small">${t('reportHint')}</p><textarea id="rt">${esc(text)}</textarea>
    <div class="row2"><button class="btn b-gold" id="cp">${t('copy')}</button><button class="btn b-blue" onclick="home()">${t('home')}</button></div><div class="fb" id="fb"></div></div>`;
  document.getElementById('cp').onclick=()=>{
    const fb=document.getElementById('fb');
    const ta=document.getElementById('rt');
    const done=()=>{ fb.className='fb ok'; fb.textContent=t('copied'); };
    try{ navigator.clipboard.writeText(text).then(done).catch(()=>{ ta.select(); fb.textContent=t('longPress'); }); }
    catch(e){ ta.select(); fb.textContent=t('longPress'); }
  };
}
try{ if(L.nav) localStorage.setItem('last-lesson', JSON.stringify(L.nav)); }catch(e){}
applyStatic(); home();

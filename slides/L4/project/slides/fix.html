<section id="fix">
<p class="eyebrow">游戏 4 · 找错误</p>
<h2>找错误：哪里不对？</h2>
<div class="rows">
<div class="row"><p class="tag2">错句</p><p class="prompt">他穿着了一件白色的衣服。</p><p class="ans fragment">他穿着一件白色的衣服。</p></div>
<div class="row"><p class="tag2">错句</p><p class="prompt">她很高兴得说。</p><p class="ans fragment">她很高兴地说。</p></div>
<div class="row"><p class="tag2">错句</p><p class="prompt">这是我妈妈地裤子。</p><p class="ans fragment">这是我妈妈的裤子。</p></div>
<div class="row"><p class="tag2">错句</p><p class="prompt">他跑地很快。</p><p class="ans fragment">他跑得很快。</p></div>
</div>
<aside>3 分钟。让她先说错在哪儿、说出正确的句子，再点击显示答案。错在哪里：1 “着”后面不用“了”；2 “地”放在动词前面：高兴地说；3 “的”放在名词前面：妈妈的裤子；4 “得”放在动词后面：跑得很快。</aside>
</section>

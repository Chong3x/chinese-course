<p class="eyebrow">语法 2</p>
<h2>动词 ＋ 得 ＋ 怎么样</h2>
<p class="rule">跑得很快、跳得很好　　有宾语：跳舞 ＋ 跳得很好</p>
<div class="exs">
<p class="ex">她跑<span class="nw">得</span><span class="nwpy">de</span>很快。</p>
<p class="ex">他<span class="nw">跳舞</span><span class="nwpy">tiàowǔ</span>跳<span class="nw">得</span><span class="nwpy">de</span>很好。</p>
<p class="ex">你<span class="nw">画</span><span class="nwpy">huà</span><span class="nw">得</span><span class="nwpy">de</span>很不错！</p>
</div>
<div class="rows">
<div class="row"><p class="n">1</p><p class="prompt">她跑得怎么样？（很快）</p><p class="ans fragment">她跑得很快。</p></div>
<div class="row"><p class="n">2</p><p class="prompt">他踢足球踢得怎么样？（很好）</p><p class="ans fragment">他踢足球踢得很好。</p></div>
</div>

<section id="gram2" class="alt">
<p class="eyebrow">语法 2</p>
<h2>已经……了 ／ 快要……了</h2>
<p class="rule">已经……了 = already　　快要……了 = about to</p>
<div class="exs">
<p class="ex">我<span class="nw">已经</span><span class="nwpy">yǐjīng</span>到<span class="nw">车站</span><span class="nwpy">chēzhàn</span>了。</p>
<p class="ex"><span class="nw">公交车</span><span class="nwpy">gōngjiāochē</span><span class="nw">快要</span><span class="nwpy">kuàiyào</span>来了。</p>
<p class="ex">八点了，我们<span class="nw">快要</span><span class="nwpy">kuàiyào</span>上课了！</p>
</div>
<div class="rows">
<div class="row"><p class="n">1</p><p class="prompt">你吃饭了吗？（已经）</p><p class="ans fragment">我已经吃饭了。</p></div>
<div class="row"><p class="n">2</p><p class="prompt">电影几点开始？（快要）</p><p class="ans fragment">电影快要开始了。</p></div>
</div>

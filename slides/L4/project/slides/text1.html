<h2>我的好朋友</h2>
<div class="dialog">
<p class="para">我的好朋友叫丽娜。她<span class="nw">个子</span><span class="nwpy">gèzi</span>很<span class="nw">高</span><span class="nwpy">gāo</span>，<span class="nw">眼睛</span><span class="nwpy">yǎnjing</span>很大。</p>
<p class="para">她很喜欢<span class="nw">笑</span><span class="nwpy">xiào</span>，<span class="nw">笑</span><span class="nwpy">xiào</span>起来很漂亮。她最喜欢的<span class="nw">颜色</span><span class="nwpy">yánsè</span>是<span class="nw">绿色</span><span class="nwpy">lǜsè</span>。</p>
<p class="para">今天她穿<span class="nw">着</span><span class="nwpy">zhe</span><span class="nw">白色</span><span class="nwpy">báisè</span>的衣服和<span class="nw">黑色</span><span class="nwpy">hēisè</span>的<span class="nw">裤子</span><span class="nwpy">kùzi</span>，<span class="nw">手</span><span class="nwpy">shǒu</span>里拿<span class="nw">着</span><span class="nwpy">zhe</span>一杯奶茶。</p>
<p class="para">我们<span class="nw">从小</span><span class="nwpy">cóngxiǎo</span>就是好朋友。我还<span class="nw">记得</span><span class="nwpy">jìde</span><span class="nw">小时候</span><span class="nwpy">xiǎoshíhou</span>，我们经常一起高兴地跳舞。</p>
<p class="para">她跳舞跳<span class="nw">得</span><span class="nwpy">de</span>很好，我跳<span class="nw">得</span><span class="nwpy">de</span>不好。但是她说：“没关系，我们一起跳！”</p>

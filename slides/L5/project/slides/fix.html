<section id="fix">
<p class="eyebrow">游戏 4 · 找错误</p>
<h2>找错误：哪里不对？</h2>
<div class="rows">
<div class="row"><p class="tag2">错句</p><p class="prompt">咖啡比奶茶很贵。</p><p class="ans fragment">咖啡比奶茶贵。</p></div>
<div class="row"><p class="tag2">错句</p><p class="prompt">你喝咖啡吗还是奶茶？</p><p class="ans fragment">你喝咖啡还是奶茶？</p></div>
<div class="row"><p class="tag2">错句</p><p class="prompt">虽然很贵，所以我不买。</p><p class="ans fragment">虽然很贵，但是我还想买。</p></div>
<div class="row"><p class="tag2">错句</p><p class="prompt">我比他不高。</p><p class="ans fragment">我没有他高。</p></div>
</div>
<aside>3 分钟。让她先说错在哪儿、说出正确的句子，再点击显示答案。错在哪里：1 比字句里不能加“很”；2 用“还是”的问句后面不加“吗”；3 “虽然”配“但是”，“因为”才配“所以”；4 “比”的否定常说“A 没有 B 高”。</aside>
</section>

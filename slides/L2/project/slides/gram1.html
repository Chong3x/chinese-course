<p class="eyebrow">语法 1</p>
<h2>A 离 B ＋ 很远 / 很近</h2>
<p class="rule">说两个地方远不远：A 离 B 很远 / 很近 / 不远</p>
<div class="exs">
<p class="ex">我家<span class="nw">离</span><span class="nwpy">lí</span>学校很<span class="nw">近</span><span class="nwpy">jìn</span>。</p>
<p class="ex"><span class="nw">机场</span><span class="nwpy">jīchǎng</span><span class="nw">离</span><span class="nwpy">lí</span>我家很<span class="nw">远</span><span class="nwpy">yuǎn</span>。</p>
<p class="ex"><span class="nw">地铁</span><span class="nwpy">dìtiě</span>站<span class="nw">离</span><span class="nwpy">lí</span>这儿不<span class="nw">远</span><span class="nwpy">yuǎn</span>，<span class="nw">走路</span><span class="nwpy">zǒulù</span>五分钟。</p>
</div>
<div class="rows">
<div class="row"><p class="n">1</p><p class="prompt">你家离学校远吗？</p><p class="ans fragment">我家离学校很近 / 很远。</p></div>
<div class="row"><p class="n">2</p><p class="prompt">商场离你家远吗？</p><p class="ans fragment">商场离我家不远。</p></div>
</div>

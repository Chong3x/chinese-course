<section id="gram2" class="alt">
<p class="eyebrow">语法 2</p>
<h2>……还是……？ ／ 虽然……，但是……</h2>
<p class="rule">还是：问两个里面选哪个　　虽然……，但是……：前后意思不一样</p>
<div class="exs">
<p class="ex">你喝<span class="nw">咖啡</span><span class="nwpy">kāfēi</span><span class="nw">还是</span><span class="nwpy">háishi</span>喝<span class="nw">奶茶</span><span class="nwpy">nǎichá</span>？</p>
<p class="ex">你想吃<span class="nw">肉</span><span class="nwpy">ròu</span><span class="nw">还是</span><span class="nwpy">háishi</span>吃<span class="nw">鱼</span><span class="nwpy">yú</span>？</p>
<p class="ex"><span class="nw">虽然</span><span class="nwpy">suīrán</span>这家<span class="nw">饭馆</span><span class="nwpy">fànguǎn</span>有点儿远，<span class="nw">但是</span><span class="nwpy">dànshì</span>菜很好吃。</p>
</div>
<div class="rows">
<div class="row"><p class="n">1</p><p class="prompt">用“还是”问：咖啡 / 奶茶</p><p class="ans fragment">你要咖啡还是奶茶？</p></div>
<div class="row"><p class="n">2</p><p class="prompt">虽然很贵，……</p><p class="ans fragment">虽然很贵，但是很好吃。</p></div>
</div>
<aside>6 分钟。先读例句，她跟读；再让她回答下面两个问题，答完点击显示参考答案。最后让她自己用这个句型说两句关于自己的话。</aside>
</section>

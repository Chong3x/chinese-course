<p class="eyebrow">语法 2</p>
<h2>的 · 得 · 地</h2>
<p class="rule">的 ＋ 名词：我的书包　　得 ＋ 怎么样：跑得很快　　地 ＋ 动词：高兴地笑</p>
<div class="exs">
<p class="ex">这是我<span class="nw">自己</span><span class="nwpy">zìjǐ</span>的书包。</p>
<p class="ex">她跳舞跳<span class="nw">得</span><span class="nwpy">de</span>很好。</p>
<p class="ex">她很高兴地<span class="nw">笑</span><span class="nwpy">xiào</span>了。</p>
</div>
<div class="rows">
<div class="row"><p class="n">1</p><p class="prompt">她___眼睛很大。（的 / 得 / 地）</p><p class="ans fragment">她的眼睛很大。</p></div>
<div class="row"><p class="n">2</p><p class="prompt">他高兴___说：“谢谢！”</p><p class="ans fragment">他高兴地说：“谢谢！”</p></div>
</div>

<p class="eyebrow">课文 · 拼音版</p>
<h2>阿依达怎么去学校？</h2>
<div class="dialog">
<div class="line"><p class="spk">小明</p><p class="say">阿依达，你每天怎么去学校？</p></div>
<div class="line"><p class="spk">阿依达</p><p class="say">我家<span class="nw">离</span><span class="nwpy">lí</span>学校很<span class="nw">近</span><span class="nwpy">jìn</span>，我<span class="nw">经常</span><span class="nwpy">jīngcháng</span><span class="nw">走路</span><span class="nwpy">zǒulù</span>去，<span class="nw">有时</span><span class="nwpy">yǒushí</span>也坐<span class="nw">公交车</span><span class="nwpy">gōngjiāochē</span>。</p></div>
<div class="line"><p class="spk">小明</p><p class="say">我家<span class="nw">离</span><span class="nwpy">lí</span>学校很<span class="nw">远</span><span class="nwpy">yuǎn</span>，我每天坐<span class="nw">地铁</span><span class="nwpy">dìtiě</span>，<span class="nw">路上</span><span class="nwpy">lùshang</span>要四十分钟。</p></div>
<div class="line"><p class="spk">阿依达</p><p class="say">你每天几点<span class="nw">出门</span><span class="nwpy">chūmén</span>？</p></div>
<div class="line"><p class="spk">小明</p><p class="say">七点就<span class="nw">出门</span><span class="nwpy">chūmén</span>了。你看，<span class="nw">已经</span><span class="nwpy">yǐjīng</span>八点了，我们<span class="nw">快要</span><span class="nwpy">kuàiyào</span>上课了！</p></div>
<div class="line"><p class="spk">阿依达</p><p class="say">没关系，老师还没来呢。</p></div>
</div>
<aside>5 分钟。你先读一遍，她跟读一遍。生词后面有拼音。读完以后翻到下一页，不看拼音再读一遍。</aside>
</section>

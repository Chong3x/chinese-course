<h2>游戏：猜猜他是谁？</h2>
<div class="frames">
<p class="frame">他 / 她是一个男孩儿 / 女孩儿。</p>
<p class="frame">他 / 她个子______，眼睛______。</p>
<p class="frame">他 / 她今天穿着______。</p>
<p class="frame">他 / 她最喜欢的颜色是______。</p>
<p class="frame">他 / 她______得很______。</p>
</div>
<aside>4 分钟。让她用这些句子说自己的情况。第一遍不打断，说完只纠正 1–2 个最重要的错误，再让她重说一遍。</aside>
</section>

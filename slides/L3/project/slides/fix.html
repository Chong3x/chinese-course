<section id="fix">
<p class="eyebrow">游戏 4 · 找错误</p>
<h2>找错误：哪里不对？</h2>
<div class="rows">
<div class="row"><p class="tag2">错句</p><p class="prompt">我不去过中国。</p><p class="ans fragment">我没去过中国。</p></div>
<div class="row"><p class="tag2">错句</p><p class="prompt">她跑很快。</p><p class="ans fragment">她跑得很快。</p></div>
<div class="row"><p class="tag2">错句</p><p class="prompt">他踢足球得很好。</p><p class="ans fragment">他踢足球踢得很好。</p></div>
<div class="row"><p class="tag2">错句</p><p class="prompt">我打足球。</p><p class="ans fragment">我踢足球。</p></div>
</div>
<aside>3 分钟。让她先说错在哪儿、说出正确的句子，再点击显示答案。错在哪里：1 “过”的否定用“没”，不用“不”；2 说做得怎么样要加“得”；3 有宾语时动词要说两次：踢足球踢得很好；4 足球用“踢”，篮球用“打”。</aside>
</section>

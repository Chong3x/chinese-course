<section id="rules" class="alt">
<p class="eyebrow">闯关规则</p>
<h2>七个关卡，你能走多远？</h2>
<div class="steps levels">
<div class="step"><p class="num">1</p><p class="label">闪电认词</p></div>
<div class="step"><p class="num">2</p><p class="label">选词填空</p></div>
<div class="step"><p class="num">3</p><p class="label">句子变变变</p></div>
<div class="step"><p class="num">4</p><p class="label">排一排</p></div>
<div class="step"><p class="num">5</p><p class="label">找错误</p></div>
<div class="step"><p class="num">6</p><p class="label">记忆挑战</p></div>
<div class="step"><p class="num">7</p><p class="label">终极挑战</p></div>
</div>
<p class="lead">通关条件：3 秒内答对。答错的题，这一关最后再来一次，全对才能过关！</p>
<aside>“直到熟练”的关键在这里：每一关答错的题记下来，这一关结束时再问一遍，直到她 3 秒内能答对。熟练度比速度重要，刚开始慢一点没关系，第二遍要求快一点。每过一关给一颗星，青少年很吃这一套。</aside>
</section>
